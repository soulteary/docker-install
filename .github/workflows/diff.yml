name: Diff

on:
  pull_request:

jobs:
  diff:
    name: Diff
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Diff stable
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
            make CHANNEL=stable diff

      - name: Diff test
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
            make CHANNEL=test diff

