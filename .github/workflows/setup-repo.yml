name: setup-repo option regression

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test-setup-repo-options:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Check shell syntax
      run: |
        sh -n install.sh
        sh -n scripts/test-setup-repo.sh
    - name: Check setup-repo options (offline only)
      run: |
        sh scripts/test-setup-repo.sh
        TEST_SHELL=bash sh scripts/test-setup-repo.sh
